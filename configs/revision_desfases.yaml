# Fase 2: decisiones de la revisión a ojo de los tramos de desfase de la regla relativa (2026-10-31).
# Escrito a mano tras mirar las imágenes de reports/alineacion/revision_desfases/ (una por tramo) con la medida de cada
# persona (personas_tramos.csv) y el desplazamiento del fondo (fondo_tramos.csv). Los px son de la térmica (640 × 512).
# Los tramos "todas corridas" (2 o más personas, todas a más de 1 altura) no están aquí: se excluyen sin revisión.
# Lo lee scripts/fase2_revision_desfases.py --aplicar, que escribe configs/exclusiones_desfase.yaml.

# Tramos decididos después de la revisión (no están en tramos.csv).
tramos_adicionales:
  - {vuelo: 210924_FHL_Enterprise_0401, desde: 371, hasta: 372, decision: excluir,
     motivo: "apareció al volver a estimar la semejanza (mediana 0.99 -> 1.02 en la 371); las 4 personas y el fondo se corren juntos +15, +26 y +65 px de la 370 a la 372; en la 369 coinciden. Decidido el 2026-10-31"}
  - {vuelo: 210924_FHL_Enterprise_0405, desde: 160, hasta: 161, decision: excluir,
     origen: "regla relativa con la semejanza congelada, revisado a ojo al cerrar los desfases",
     motivo: "RGB borrosa por el movimiento; la persona se corre (+16, −11) y (+18, −11) px y el fondo de la mitad derecha (+9, +8) y (+17, +8) px (respuesta 0.26 y 0.25), frente a (−5, −2) en la 158, 159, 162 y 163; los bordes de los árboles salen dobles. Decidido el 2026-10-31"}

