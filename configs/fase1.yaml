# Fase 1: reconstrucción de los pares RGB-térmicos de WiSARDv1.
extensiones_imagen: [.jpg, .jpeg]

# Tramos excluidos (posiciones inclusivas, dentro de la pareja de carpetas).
exclusiones:
  - carpeta_rgb: 220109_Baker_Enterprise_VIS_1
    carpeta_termica: 220109_Baker_Enterprise_IR_1
    desde: 2031             # revisado a mano el 2026-10-30 (reports/baker_corte/); antes 2051
    hasta: 2179
    motivo: en la térmica hay personas sin caja
  - carpeta_rgb: 210529_Carnation_Enterprise_VIS_0023   # vuelo completo; decidido el 2026-10-31 (fase 2)
    carpeta_termica: 210529_Carnation_Enterprise_IR_0024
    desde: 0
    hasta: 738
    motivo: zoom variable en la RGB, que cubre cerca del 11 % de la térmica; posible desfase en la posición 470
  # Despegues, aterrizajes y cambios de zoom: barrido visual de la fase 2 (reports/alineacion/barrido/ y
  # bordes_tramos/), límites confirmados el 2026-10-31.
  - carpeta_rgb: 220109_Baker_Enterprise_VIS_1
    carpeta_termica: 220109_Baker_Enterprise_IR_1
    desde: 0
    hasta: 15
    motivo: despegue (dron en el suelo hasta la 13 y despegando en la 14 y la 15)
  - carpeta_rgb: 210924_FHL_Enterprise_VIS_0401
    carpeta_termica: 210924_FHL_Enterprise_IR_0402
    desde: 0
    hasta: 10
    motivo: cambio de zoom (la RGB tiene más zoom que en el resto del vuelo hasta la 10)
  - carpeta_rgb: 210924_FHL_Enterprise_VIS_0401
    carpeta_termica: 210924_FHL_Enterprise_IR_0402
    desde: 857             # adelantado de 878 a 857 el 2026-10-31 con la distancia entre centros (semejanza)
    hasta: 895
    motivo: aterrizaje (el dron baja hasta el pasto; desde la 857 las personas de las dos cámaras se separan más de 25 px)
  # Desfases entre cámaras (la térmica muestra otro instante), medidos con la distancia entre centros de las personas
  # tras la alineación con la semejanza de cada vuelo (reports/fase2.md); decididos el 2026-10-31.
  # MtErie 0003 0-11 se excluyó y se devolvió el mismo día: el desfase venía de la homografía; con la semejanza las
  # personas están a 7-21 px.
  - carpeta_rgb: 210417_MtErie_Enterprise_VIS_0005
    carpeta_termica: 210417_MtErie_Enterprise_IR_0006
    desde: 160
    hasta: 162
    motivo: desfase entre cámaras en un giro rápido (personas separadas de 37 a 174 px)
  - carpeta_rgb: 220109_Baker_Enterprise_VIS_1
    carpeta_termica: 220109_Baker_Enterprise_IR_1
    desde: 620
    hasta: 626
    motivo: desfase entre cámaras en un giro rápido (personas separadas de 30 a 75 px)

# Exclusiones generadas por otros scripts (mismo formato). Desfases de la regla relativa revisados a ojo (fase 2,
# 31 de octubre de 2026): los escribe scripts/fase2_revision_desfases.py --aplicar desde configs/revision_desfases.yaml.
exclusiones_adicionales:
  - configs/exclusiones_desfase.yaml

# Totales que deben salir (análisis del 28 y 29 de octubre de 2026 y exclusiones de la fase 2).
esperado:
  pares: 14839
  pares_anotados: 5739
  pares_anotados_sin_excluidos: 4620   # 4 775 antes de los desfases (salen 135 + 2 de FHL 0401 371-372 + 18 de la extensión por el fondo)

# Salidas
pares: pares.csv                              # dentro de data/
tabla_por_vuelo: tabla_pares_por_vuelo.csv    # dentro de reports/

# Revisión visual del inicio del tramo excluido de Baker (scripts/fase1_baker_corte.py).
revision_baker:
  vuelo: 220109_Baker_Enterprise_1
  desde: 2030
  hasta: 2060
  paso: 2
  salida: baker_corte       # dentro de reports/
  alto_panel: 512
  fuente: arial.ttf         # fuente de Windows con tildes para los rótulos
  # Zona aproximada que ve la térmica dentro de la RGB (CLAUDE.md); solo como referencia visual.
  fov_termica_en_rgb: {x: [0.18, 0.84], y: [0.06, 0.98]}
