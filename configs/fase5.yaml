# Fase 5: entrenamiento de YOLO26s con scripts/entrenar.py.
# Uso: .venv\Scripts\python.exe scripts\entrenar.py --config configs\fase5.yaml --rutas configs\rutas.yaml --corrida NOMBRE
# Cada corrida toma `base` y cambia solo lo que dice. Las claves de `ultralytics` van tal cual a model.train(); lo que no
# está aquí queda con el valor por omisión de Ultralytics 8.4.194 (optimizer=auto, close_mosaic=10, mosaic=1.0, etc.).

base:
  fase: 5a
  pesos: yolo26s.pt                  # relativo a la raíz del repositorio
  datos: configs/fusion.yaml
  carpeta: fase5                     # dentro de runs/
  inicio_cuarto_canal: azar          # azar (lo que hace Ultralytics) o promedio (de los 3 de color, en la primera capa)
                                     # elegido en la fase 5a para la fusión: promedio (CLAUDE.md); se pone en cada corrida
  ultralytics:
    seed: 0
    deterministic: true
    imgsz: 640
    epochs: 100
    batch: 16                        # el mismo para los tres modelos (fase 5a)
    hsv_h: 0.0
    hsv_s: 0.0
    hsv_v: 0.0
    device: 0
    workers: 4                       # en todas las corridas (CLAUDE.md, 1 de noviembre de 2026): con 8 la RAM llegaba al 99.9 %
    cache: false                     # las imágenes se leen del disco por lotes, nunca todas en memoria

potencia:                            # comprobación previa, antes de cada corrida (CLAUDE.md)
  minimo_w: 90                       # mediana del límite aplicado (enforced.power.limit) con solo la GPU cargada
                                     # el límite real durante el entrenamiento se registra, sin mínimo
  segundos_carga: 30
  plan: Performance                  # plan de energía de Windows
  armoury_crate: Rendimiento         # no se puede leer desde Python; se declara

cerrar_antes:                        # no se entrena si alguno está abierto (CLAUDE.md); nombres de proceso sin .exe
  - RobloxPlayerBeta
  - ChatGPT
  - chrome

codigos_salida:                      # de scripts/entrenar.py cuando no entrena; scripts/noche.ps1 reintenta solo `potencia`
  otro: 1                            # corrida inexistente, configuración, o un error al entrenar (Python sale con 1)
  aplicaciones: 3                    # alguna de cerrar_antes está abierta
  potencia: 4                        # sin enchufe, otro plan de energía o límite aplicado bajo el mínimo
  carpeta_existe: 5                  # runs/<carpeta>/<corrida> ya existe

monitor:
  intervalo_s: 1                     # lecturas de nvidia-smi y de la RAM durante el entrenamiento

memoria:
  # "Entra" si Ultralytics no bajó el lote por falta de memoria y el pico de memoria dedicada de la GPU (nvidia-smi) no
  # pasa de esta fracción del total. Así se descarta que Windows haya usado memoria compartida del sistema.
  fraccion_maxima: 0.95

corridas:
  # Lote: 2 épocas con mosaico (close_mosaic=0), como las 90 primeras de un entrenamiento de 100 épocas. Con
  # close_mosaic=10, Ultralytics quitaría el mosaico desde la primera época de una corrida de 10 épocas o menos.
  fusion_lote16_2ep:                 # se corrió con 8 procesos de lectura, el valor de entonces
    ultralytics: {epochs: 2, batch: 16, close_mosaic: 0, workers: 8}
  fusion_lote8_2ep:                  # no se corre si el lote 16 entra
    ultralytics: {epochs: 2, batch: 8, close_mosaic: 0}
  # Diagnóstico: con workers=8 (Ultralytics abre 8 procesos de lectura para entrenar y 16 para validar) la RAM llegó al
  # 99.9 % y el límite aplicado de la GPU bajó a 70 W. Se prueba con menos procesos.
  fusion_lote16_2ep_w4:
    ultralytics: {epochs: 2, batch: 16, close_mosaic: 0, workers: 4}

  # Inicio del cuarto canal: 10 épocas, todo lo demás igual (regla en CLAUDE.md). Con close_mosaic=10 por omisión, las
  # dos entrenan sin mosaico las 10 épocas.
  fusion_azar_10ep:
    inicio_cuarto_canal: azar
    ultralytics: {epochs: 10}
  fusion_promedio_10ep:
    inicio_cuarto_canal: promedio
    ultralytics: {epochs: 10}

  # Tiempo por época de los otros dos modelos: 2 épocas con mosaico y la última sin él (close_mosaic=1).
  rgb_tiempo_3ep:
    datos: configs/rgb.yaml
    ultralytics: {epochs: 3, close_mosaic: 1}
  termico_tiempo_3ep:
    datos: configs/termico.yaml
    ultralytics: {epochs: 3, close_mosaic: 1}

  # Fase 5b: los tres modelos, 100 épocas (base: lote 16, 4 procesos de lectura, seed=0, hsv=0, close_mosaic=10 por
  # omisión). Se corren uno tras otro, en este orden. Solo entrenamiento y validación: la prueba (FHL 0405) es la fase 6.
  fusion_100ep:
    fase: 5b
    inicio_cuarto_canal: promedio      # elegido en la fase 5a
  rgb_100ep:
    fase: 5b
    datos: configs/rgb.yaml
  termico_100ep:
    fase: 5b
    datos: configs/termico.yaml

# Resumen de la fase 5b (scripts/fase5b_resumen.py). Solo lee las corridas: no evalúa nada en la prueba.
resumen_5b:
  carpeta: fase5b                    # dentro de reports/
  corridas:                          # en este orden; color = slots 1 a 3 de la paleta de referencia (modo claro)
    fusion_100ep: {nombre: Fusión temprana, color: "#2a78d6"}
    rgb_100ep: {nombre: Solo RGB, color: "#eb6834"}
    termico_100ep: {nombre: Solo térmica, color: "#1baf7a"}
  # scripts/fase5b_copiar.py: archivos de cada corrida que se copian a reports/<carpeta>/<corrida>/ (más su fila de la
  # bitácora). Ultralytics hace las curvas y las matrices con best.pt en la validación final.
  archivos_corrida: [results.csv, results.png, BoxPR_curve.png, BoxF1_curve.png, confusion_matrix.png,
                     confusion_matrix_normalized.png, args.yaml, resumen.json]
  figura:
    dpi: 150
    fondo: "#fcfcfb"
    texto: "#0b0b0b"
    texto_secundario: "#52514e"
    rejilla: "#e4e3df"
