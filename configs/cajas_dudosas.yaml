# Cajas térmicas de WiSARD dudosas de la prueba (FHL 0405). Decidido el 2026-11-01, tras la ronda 2 entre anotadores.
# Son las personas de la muestra que los dos anotadores marcaron "no es persona" en modo simple con la regla aclarada
# (data/oclusion_primero_simple_ronda2.csv y data/oclusion_segundo_simple_ronda2.csv; detalle en
# reports/fase4_validacion_auto/entre_anotadores/ronda2/respuestas.csv): en la caja térmica no se ve una persona.
# - Las etiquetas de prueba NO se tocan: estas cajas siguen en data/etiquetas/termica/ y en
#   data/datasets/<modelo>/labels/test/ (enlaces duros), como las dejó WiSARD (sin cajas repetidas).
# - Quedan sin nivel de oclusión: no entran en ningún nivel (al evaluar un nivel se ignoran, como las de los otros).
# - Fase 6: las métricas se calculan con y sin ellas (sin ellas = esas cajas se marcan como ignoradas: no cuentan
#   como persona perdida ni una detección sobre ellas como falso positivo).
# Una caja se identifica por `etiqueta` (dentro de data/etiquetas/) y `indice_caja` (línea, desde 0, sin contar líneas
# vacías); `linea` es su texto exacto (clase cx cy w h, YOLO normalizado) y `caja_px` la misma caja en px de la térmica
# (x0, y0, x1, y1; 640 x 512). `n_muestra` es el número de la persona en la muestra (1 a 75).
# Las "no es persona" que marca un solo anotador no están aquí (ver reports/fase4_validacion_auto.md).
