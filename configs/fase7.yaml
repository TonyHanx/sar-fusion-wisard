# Fase 7 (18 de noviembre de 2026): mejorar el resultado sin romper el protocolo.
# - FHL 0405/0406 (la prueba) no se usa en nada: ni entrenamiento ni validación. Sus imágenes no se leen.
# - No se tocan runs/ ni los datasets existentes: todo lo nuevo va en runs/<carpeta>/, reports/fase7.md y este archivo.
# - Validación: la de siempre (FHL 0134 y MtErie 0007).
# Partes: C0 auditoría (src/ampliacion/c0_auditoria_termicas.py), C1 datasets, C2 receta, C3 corridas y C4 evaluación.

carpeta: fase7                       # dentro de runs/
fase_bitacora: "7"
pares: pares.csv                     # dentro de data/
tam_termica: [640, 512]
extensiones: [.jpeg, .jpg, .png]
tramos_px: [8, 12, 20, 32]           # lado mayor: <8, 8-12, 12-20, 20-32, >=32 (QFDet), como en el diagnóstico
prohibidas: [210924_FHL_Enterprise_IR_0406, 210924_FHL_Enterprise_VIS_0405]   # FHL 0405: el script sale si aparecen
fuente: arial.ttf

# C0. Auditoría de las térmicas anotadas fuera de los 4 617 pares (sin entrenar).
c0:
  # Carpetas IR con etiquetas fuera de nuestros pares (A1 del diagnóstico). Baker IR_2 de 2022 (todos los .txt
  # vacíos) queda fuera, como pidió el usuario.
  carpetas:
    - 210327_Airfield_FLIR_IR_1
    - 210327_Airfield_FLIR_IR_2
    - 210327_Airfield_FLIR_IR_3
    - 210327_Airfield_FLIR_IR_4
    - 210327_Airfield_FLIR_IR_5
    - 210327_Airfield_FLIR_IR_6
    - 210327_Airfield_FLIR_IR_7
    - 210327_Airfield_FLIR_IR_8
    - 200929_Karen_FLIR_IR_1
    - 200929_Karen_FLIR_IR_2
    - 200929_Karen_FLIR_IR_3
    - 200929_Karen_FLIR_IR_4
    - 200929_Karen_FLIR_IR_5
    - 200929_Karen_FLIR_IR_6
    - 200910_Carnation_FLIR_IR_1
    - 200910_Carnation_FLIR_IR_2
    - 200910_Carnation_FLIR_IR_3
    - 200910_Carnation_FLIR_IR_4
    - 200910_Carnation_FLIR_IR_5
    - 200910_Carnation_FLIR_IR_6
    - 200910_Carnation_FLIR_IR_7
    - 200704_Baker_FLIR_IR_1
    - 200704_Baker_FLIR_IR_2
    - 210924_FHL_Enterprise_IR_0404   # pareja de FHL 0403 (RGB sin etiquetas)
    - 210924_FHL_Enterprise_IR_0565   # pareja de FHL 0564
    - 210924_FHL_Enterprise_IR_0567   # pareja de FHL 0566
    # Añadida el 18 de noviembre de 2026, cuando el usuario decidió usar la térmica de Carnation 0023/0024 (excluida
    # de los tres modelos en la fase 2 por el zoom de la RGB): se audita igual que las demás.
    - 210529_Carnation_Enterprise_IR_0024
  muestra: {con_cajas: 10, sin_cajas: 10, seed: 0}   # al azar por carpeta, cada una con su propio generador seed 0
  # Detector que solo señala candidatos para la revisión a ojo (personas sin caja, cajas sin persona); no decide nada.
  # Es el best.pt de B1 del diagnóstico (solo térmica, reparto al azar de los 6 vuelos; no vio FHL 0405).
  detector:
    pesos: runs/diagnostico/b1_termico_aleatoria_30ep/weights/best.pt
    imgsz: 640
    device: 0
    batch: 32
    conf_minima: 0.1                 # predicciones que se guardan
    conf_dibujo: 0.25                # las que se dibujan en los mosaicos
    conf_alta: 0.5                   # "posible persona sin caja": predicción >= 0.5 sin caja con IoU >= iou_minimo
    iou_minimo: 0.1
  mosaico:
    escala: 0.5                      # cada fotograma a 320 x 256
    columnas: 5
    lado_recorte: 48                 # px de la térmica alrededor del candidato
    zoom_recorte: 3
    recortes_max: 30
    vecino_max: 10                   # fotogramas sin caja: recortes donde estaban las cajas del anotado más cercano
    alto_grafico: 110
  # Marca de agua "FLIR" en la esquina inferior izquierda de las térmicas de 2020 (Baker, Karen y Carnation FLIR; no en
  # Airfield ni en las Enterprise). El detector la toma por persona: sus predicciones se ignoran en la auditoría.
  logo:
    caja: [5, 490, 54, 506]          # xyxy en px de 640 x 512, medida con los píxeles blancos en 15 fotogramas
    margen: 6
    pixeles_minimos: 200             # blancos (>= 235) en la caja en todos los fotogramas revisados = la carpeta tiene logo
    fotogramas: 15
  # C0. ¿La semejanza congelada de otro vuelo de FHL (mismo dron y mismo día) alinea la RGB con la térmica de FHL 0403,
  # 0564 y 0566 (RGB sin etiquetas)? Medida automática: corrimiento del fondo por correlación de fase de los
  # gradientes, como en la fase 2. Medida a mano: puntos de control (src/ampliacion/marcar_puntos_vuelos_nuevos.py).
  alineacion:
    vuelos:                          # rango de posiciones que se usaría (null = todo el vuelo)
      210924_FHL_Enterprise_0403: [0, 215]    # la térmica (IR_0404) solo está anotada en 0-215
      210924_FHL_Enterprise_0564: null
      210924_FHL_Enterprise_0566: null
    # La de FHL 0405 se estimó con las cajas de la prueba: se mide porque lo pidió el usuario, pero no se adopta si
    # 0134 o 0401 alcanzan.
    candidatas: [210924_FHL_Enterprise_0134, 210924_FHL_Enterprise_0401, 210924_FHL_Enterprise_0405]
    referencias: [210924_FHL_Enterprise_0134, 210924_FHL_Enterprise_0401]   # cada una con su propia semejanza
    transformaciones: configs/homografias_cajas.yaml
    muestra: 40                      # pares repartidos en el rango
    fondo_sigma: 2                   # como fase2.yaml (revision_desfases)
    fondo_respuesta_min: 0.10
    superposiciones: 2               # fotogramas por vuelo con los bordes de la RGB llevada sobre la térmica
    canny: [60, 160]
    criterio:                        # fijado el 18 de noviembre de 2026, antes de medir
      fondo_factor_referencia: 1.5   # mediana del corrimiento <= 1.5 x la mayor mediana de las referencias
      puntos_error_medio_px: 13.2    # error medio en los puntos a mano <= el de la fase 2 en FHL (13.2 px)
  # Puntos de control a mano (src/ampliacion/marcar_puntos_vuelos_nuevos.py, que usa la herramienta de la fase 2). Los valores de
  # pantalla son los de `marcado` en configs/fase2.yaml; aquí son 2 fotogramas por vuelo.
  marcado:
    carpeta_puntos: configs/fase7_puntos_control   # un yaml por vuelo, relativo a la raíz del repositorio
    puntos_minimos: 6
    ancho_ventana: 1800
    alto_ventana: 820
    margen_pantalla_px: 10
    reserva_titulo_px: 45
    lado_lupa: 400
    zoom_lupa: 4
    paso_mover: 5
    franja_inicial: {x: [0.18, 0.84], y: [0.06, 0.98]}   # sugerencia antes de 4 puntos, como en la fase 2
    nombres: [primero, segundo]
    fotogramas:                      # los más nítidos cerca de 1/3 y 2/3 del rango; en 0566 (de noche), con luces
      210924_FHL_Enterprise_0403: {primero: 63, segundo: 156}
      210924_FHL_Enterprise_0564: {primero: 345, segundo: 663}
      210924_FHL_Enterprise_0566: {primero: 227, segundo: 681}
    realce_rgb: {210924_FHL_Enterprise_0566: 6}   # solo en pantalla: la RGB de noche se multiplica por este factor
  # Clasificación tras la revisión a ojo (18 de noviembre de 2026), pendiente de confirmación del usuario.
  # - usable: en la muestra las cajas caen sobre personas y no hay personas sin caja, salvo las cortadas por el borde;
  # - con_tramos: el problema está en tramos que se quitan;
  # - no_usable: faltan personas en los fotogramas anotados, o casi nada está anotado.
  # El detector solo señaló dónde mirar; ningún tramo se decide con él.
  clasificacion:
    usable: [200929_Karen_FLIR_IR_3, 200929_Karen_FLIR_IR_4, 200929_Karen_FLIR_IR_5, 200929_Karen_FLIR_IR_6,
             200910_Carnation_FLIR_IR_1, 200910_Carnation_FLIR_IR_2, 200910_Carnation_FLIR_IR_3,
             200910_Carnation_FLIR_IR_4, 200910_Carnation_FLIR_IR_5, 200910_Carnation_FLIR_IR_6,
             200910_Carnation_FLIR_IR_7, 200704_Baker_FLIR_IR_1, 200704_Baker_FLIR_IR_2, 210327_Airfield_FLIR_IR_2,
             210327_Airfield_FLIR_IR_6, 210327_Airfield_FLIR_IR_7, 210327_Airfield_FLIR_IR_8,
             210924_FHL_Enterprise_IR_0565, 210924_FHL_Enterprise_IR_0567,
             210529_Carnation_Enterprise_IR_0024]   # añadida: cajas bien; en 144 y 535-537, personas sin caja (huecos cortos)
    con_tramos:                      # tramos [a, b] de posiciones que se quitan
      200929_Karen_FLIR_IR_1: [[316, 451]]      # cola con cajas intermitentes; persona sin caja en 451
      200929_Karen_FLIR_IR_2: []                # solo los huecos cortos: personas sin caja en 100 y 337
      210327_Airfield_FLIR_IR_1: [[575, 675]]   # mancha caliente sin caja, quizá una persona vista desde arriba (584-666)
      210327_Airfield_FLIR_IR_3: [[985, 1061]]  # una segunda persona sin caja en todo el tramo
      210327_Airfield_FLIR_IR_4: [[0, 58]]      # una segunda persona sin caja; el disco de 484-606 es un objeto fijo
      210924_FHL_Enterprise_IR_0404: [[216, 1416]]   # desde 216 no hay cajas y el grupo de personas sigue a la vista
    no_usable:
      210327_Airfield_FLIR_IR_5: "2 fotogramas con caja; persona sin caja en 95"
    # En todas: se quitan los .txt vacíos de `mosaico.vecino_max` fotogramas o menos con cajas a los dos lados (en
    # Karen 2 ahí había personas sin caja).
    huecos_cortos: true
  # Fotogramas completos que respaldan la clasificación (--parte ampliar): cajas en verde y predicciones >= conf_dibujo
  # en rojo. Salen en runs/<carpeta>/c0/revision/.
  ampliaciones:
    210327_Airfield_FLIR_IR_1: [78, 586, 602, 663]
    210327_Airfield_FLIR_IR_3: [985, 1010, 1035, 1060]
    210327_Airfield_FLIR_IR_4: [10, 40, 484, 606]
    210327_Airfield_FLIR_IR_5: [14, 15, 95, 96]
    200929_Karen_FLIR_IR_1: [315, 380, 405, 451]
    200929_Karen_FLIR_IR_2: [99, 100, 336, 337]
    210924_FHL_Enterprise_IR_0404: [215, 219, 546, 880]
    210924_FHL_Enterprise_IR_0567: [1, 597, 623, 885]

# Copia para git (src/utilidades/copiar_fase7.py): runs/ no va a git, así que las salidas livianas de runs/<carpeta>/ se copian
# a reports/<destino>/ con la misma estructura. Los PNG se guardan como JPEG para que el repositorio pese menos.
copiar:
  destino: fase7                     # dentro de reports/
  desde_runs:                        # globs dentro de runs/<carpeta>/
    - c0/auditoria/*.csv
    - c0/auditoria/*.md
    - c0/auditoria/mosaicos/*.png
    - c0/revision/*.png
    - c0/alineacion/*
    - c0/clasificacion/*
    - c1/*.csv
    - c1/*.md
    - c2/*.csv
    # corridas de C3 (sin pesos)
    - termico_*/results.csv
    - termico_*/results.png
    - termico_*/epocas.csv
    - termico_*/resumen.json
    - termico_*/args.yaml
    - fusion_*/results.csv
    - fusion_*/results.png
    - fusion_*/epocas.csv
    - fusion_*/resumen.json
    - fusion_*/args.yaml
    - rgb_*/results.csv
    - rgb_*/results.png
    - rgb_*/epocas.csv
    - rgb_*/resumen.json
    - rgb_*/args.yaml
  excluir: ["*.pt"]
  jpeg_calidad: 85

# C1. Datasets nuevos (src/ampliacion/c1_datasets_ampliados.py). Decisiones del usuario del 18 de noviembre de 2026, al cerrar C0:
#   - confirma la clasificación de C0 y la regla de los huecos cortos;
#   - FHL 0566: solo como térmica sin pareja (RGB en 0); no se marcan sus puntos;
#   - Carnation 0023/0024: su térmica entra (auditada en C0 como una carpeta más), y en la fusión sin pareja;
#   - pares anotados y excluidos de los vuelos de entrenamiento: entran como térmica (sin pareja en la fusión), salvo
#     el tramo de Baker 2031-2179 (personas sin caja en la térmica);
#   - FHL 0403 y 0564: pares reales en la fusión solo si su semejanza pasa los puntos a mano (<= 13.2 px); si no,
#     térmica sin pareja;
#   - imágenes nuevas sin persona: como máximo el 10 % del total de entrenamiento, al azar (seed 0) y repartidas por
#     carpeta.
# termico_ampliado y fusion_ampliado tienen las mismas imágenes; cambia solo si la RGB es real o va en 0.
c1:
  particion: configs/particion.yaml
  base: {termico: configs/termico.yaml, fusion: configs/fusion.yaml}   # entrenamiento y validación actuales
  excluidos_entrenamiento:
    salvo: {220109_Baker_Enterprise_1: [[2031, 2179]]}
  pares_reales:
    candidatos: {210924_FHL_Enterprise_0403: 210924_FHL_Enterprise_IR_0404,
                 210924_FHL_Enterprise_0564: 210924_FHL_Enterprise_IR_0565}
    # Los que pasan los puntos a mano (--parte puntos de C0). 18 de noviembre de 2026: ninguno. Error medio de 15.2 a
    # 18.0 px en 0403 y de 23.2 a 28.3 px en 0564, sobre 13.2: los dos entran como térmica sin pareja.
    aprobados: []
    semejanza: 210924_FHL_Enterprise_0401
  vacias:
    fraccion_maxima: 0.10            # vacías nuevas <= 10 % de todo el entrenamiento (base + nuevas)
    reparto: proporcional            # cupo por carpeta en proporción a sus vacías (restos mayores); al azar dentro
    seed: 0
  tiempo:                            # s por época = s por imagen de entrenamiento x imágenes + validación (epocas.csv)
    corridas: {termico: runs/diagnostico/b2_termico_vuelo_30ep, fusion: runs/fase5/fusion_100ep}
    epocas: 100
  salida: fase7                      # data/<salida>/ (no va a git)
  # --parte construir: imágenes nuevas en data/<salida>/{termica,fusion,rgb,etiquetas}/<carpeta>/ y datasets de
  # Ultralytics en data/<salida>/datasets/<nombre>/, con enlaces duros (la base y la validación enlazan a los datasets
  # actuales, sin tocarlos). Térmica en gris (PNG, 1 canal) y TIFF B, G, R, T como en la fase 2 (`alinear` de
  # configs/fase2.yaml); sin pareja, B, G, R = 0.
  construir:
    alinear: configs/fase2.yaml      # se leen nivel_png, tiff_*, prerreducir_area e interpolacion de su sección `alinear`
    procesos: 6
    enlace: duro
    nombres: {termico: termico_ampliado, fusion: fusion_ampliado}
    verificacion: 8                  # TIFF nuevos al azar (seed) que se leen con el dataset de Ultralytics
    seed: 0

# Antes de fusion_base (19 de noviembre de 2026, pedido del usuario): de qué vuelo viene cada imagen de los datasets
# ampliados, comprobado con los archivos (enlaces duros y píxeles de la térmica contra las originales) y no con
# composicion.csv (src/ampliacion/origen_imagenes.py). Las carpetas `prohibidas` no se leen.
origen:
  datasets: [termico_ampliado, fusion_ampliado]   # en data/<c1.salida>/datasets/; primero el térmico
  vigilar:                           # vuelos (columna `vuelo` de pares.csv): ninguna imagen nueva puede venir de ellos
    - 210417_MtErie_Enterprise_0005  # tiene 15 nuevas en cada dataset (pares excluidos por desfase en la fase 2); el
                                     # usuario decidió el 19 nov 2026 que se quedan (reports/fase7.md), así que el
                                     # script sale con código 1 por esa comprobación
    - 210417_MtErie_Enterprise_0007
    - 210924_FHL_Enterprise_0405
  procesos: 6
  carpeta: c1                        # runs/<carpeta>/c1/; el detalle por imagen, en c1/origen/ (no se copia a git)

# C2: receta para objetos pequeños (src/entrenamiento/entrenar_fase7.py; el dropout de modalidad está en src/entrenamiento/dropout_modalidad.py).
c2:
  fitness: metrics/mAP50(B)          # best.pt y la parada temprana por el mAP@0.5 de validación (Ultralytics: mAP@0.5:0.95)
  verificacion:                      # --verificar: sin entrenar
    datos: configs/fusion.yaml       # el entrenamiento base: todas sus imágenes tienen RGB real
    imagenes: 8
    p: 0.3                           # solo para la verificación; en cada corrida va su p_sin_rgb
    relleno: 114                     # gris con que Ultralytics rellena el LetterBox y el mosaico (4 canales)
    seed: 0
    carpeta: c2                      # runs/<carpeta>/c2/

# C3: corridas, en este orden (src/entrenamiento/entrenar_fase7.py --corrida NOMBRE). Cada una toma `base` y cambia lo que dice.
c3:
  carpeta: fase7                     # runs/fase7/<corrida>/
  pesos: weights/yolo26s.pt
  # potencia, cerrar_antes, codigos_salida, monitor y memoria: las mismas comprobaciones que en la fase 5
  comprobaciones: configs/fase5.yaml
  # Cifra principal de cada corrida en C4: la última época y el promedio de las `ultimas_epocas` últimas de results.csv;
  # best.pt (mayor mAP@0.5 de validación) va como dato secundario (decisión del usuario, 19 de noviembre de 2026).
  ultimas_epocas: 5
  base:
    fase: "7"
    inicio_cuarto_canal: azar        # solo con 4 canales; la fusión usa promedio (fase 5a)
    p_sin_rgb: 0.0                   # dropout de modalidad, solo en el entrenamiento y con 4 canales
    # Receta cambiada el 19 de noviembre de 2026, antes de las corridas 2 a 4 (decisión del usuario): con patience = 20,
    # termico_base paró en la época 30 de 100, con la tasa de aprendizaje alta (0.0014) y el mosaico activo, así que no
    # completó la receta (quedó como termico_base_p20). Ahora: 50 épocas, sin parada temprana y close_mosaic = 10.
    ultralytics:                     # Tabla 8 (fase 5), con 50 épocas; lo demás, por omisión de Ultralytics 8.4.194
      seed: 0
      deterministic: true
      imgsz: 640
      epochs: 50
      batch: 16
      hsv_h: 0.0
      hsv_s: 0.0
      hsv_v: 0.0
      device: 0
      workers: 4
      cache: false
      patience: 0                    # sin parada temprana: en 8.4.194, EarlyStopping usa `patience or inf`
      close_mosaic: 10               # las 10 últimas épocas sin mosaico (el valor por omisión, explícito)
      # Optimizador fijo, el que eligió optimizer=auto en la fase 5 (AdamW, lr0 = 0.002 = 0.002 x 5 / (4 + 1), betas
      # 0.9 y 0.999, y warmup_bias_lr = 0, que auto también fija). Con auto, los datasets ampliados (14 110 imágenes,
      # 221 x 50 = 11 050 iteraciones > 10 000) cambiarían a MuSGD con lr0 = 0.01, y la corrida cambiaría algo más
      # que los datos.
      optimizer: AdamW
      lr0: 0.002
      momentum: 0.9
      warmup_bias_lr: 0.0
  corridas:
    # Ya corrida con la receta anterior (19 de noviembre de 2026, renombrada desde termico_base): evidencia de que
    # patience = 20 cortó el calendario (paró en la época 30 de 100). No se vuelve a correr.
    termico_base_p20:
      datos: configs/termico.yaml
      ultralytics: {epochs: 100, patience: 20}
    # El primer intento con la receta nueva se cortó en la época 41 (Claude Code lo detuvo por falta de RAM del
    # sistema): está en runs/fase7/termico_base_cortada/ y no se usa.
    termico_base:
      datos: configs/termico.yaml
    termico_ampliado:
      datos: data/fase7/datasets/termico_ampliado/termico_ampliado.yaml
    fusion_base:                     # sin dropout de modalidad
      datos: configs/fusion.yaml
      inicio_cuarto_canal: promedio
    fusion_ampliado:
      datos: data/fase7/datasets/fusion_ampliado/fusion_ampliado.yaml
      inicio_cuarto_canal: promedio
      # 19 de noviembre de 2026, decisión del usuario antes de C3: p se cambia de 0.3 a 0 porque el 77 % de las imágenes
      # de entrenamiento ya tienen la RGB en 0; así la corrida 4 solo cambia los datos frente a la base. El dropout
      # queda como ablación posterior.
      p_sin_rgb: 0.0
    # Corrida 5, después de C4 (decisión del usuario del 21 de noviembre de 2026, para la fase 8, configs/fase8.yaml):
    # solo RGB con la misma receta y los mismos datos base que termico_base y fusion_base, porque no había ningún modelo
    # de solo RGB (rgb_100ep de la fase 5 se descartó). Solo base: el ampliado no tiene RGB en el 77 % de sus imágenes.
    rgb_base:
      datos: configs/rgb.yaml

# C4: evaluación en validación con el evaluador propio (src/evaluacion/c4_evaluar_validacion.py, que usa las funciones de
# src/evaluacion/evaluar.py sin cambiarlo). Reglas fijadas por el usuario el 21 de noviembre de 2026, antes de evaluar y antes
# de anotar la oclusión de la validación (reports/fase7.md, C4).
c4:
  base: configs/fase6.yaml           # prediccion, evaluacion (IoU 0.5, F2, maxDets), bootstrap, mcnemar, figura y la
                                     # partición `validacion` (FHL 0134 y MtErie 0007: 442 fotogramas, 500 personas,
                                     # 10 bloques)
  carpeta: fase7/c4                  # dentro de runs/: predicciones en runs/fase7/c4/validacion/<modelo>/
  salidas: reports/fase7/c4          # tablas y figura
  corridas: [termico_base, termico_ampliado, fusion_base, fusion_ampliado]   # en runs/<c3.carpeta>/, datos de c3.corridas
  # Pesos que se evalúan. Solo existen last.pt (época 50) y best.pt: las épocas 46-49 no se guardaron. La cifra
  # principal es last.pt con el evaluador propio, y al lado el promedio de las 5 últimas de results.csv (validación de
  # Ultralytics, sin IC). best.pt es secundaria.
  pesos: {last: weights/last.pt, best: weights/best.pt}
  principal: last
  # Las fusiones se evalúan también con la RGB en 0 (src/entrenamiento/dropout_modalidad.py, p = 1; la térmica igual).
  rgb_cero: [fusion_base, fusion_ampliado]
  # Umbral de confianza para recall, precisión, F2 y McNemar: la regla de la fase 6 (CLAUDE.md, "Métricas"). Por modelo y
  # peso, el que maximiza el F2 en la validación, en la rejilla de 0.05 a 0.95 con paso 0.05; si hay empate, el más alto.
  # Se elige con todas las personas de WiSARD de los 442 fotogramas (sin mirar la anotación de oclusión). Las variantes
  # con la RGB en 0 usan el umbral del mismo peso con la RGB real, para que solo cambie la entrada. Se elige y se mide
  # en la misma validación: el recall sale algo optimista (igual para todos los modelos).
  umbral: {desde: 0.05, hasta: 0.95, paso: 0.05}
  # Diferencias con IC por bootstrap (last.pt y best.pt) y McNemar (solo last.pt), a − b. Bonferroni por el número de
  # pares (4) dentro de cada subconjunto.
  pares:
    - [fusion_base, termico_base]
    - [fusion_ampliado, termico_ampliado]
    - [fusion_ampliado_rgb0, fusion_ampliado]
    - [fusion_base_rgb0, fusion_base]
  # Nivel de oclusión de la validación: a mano, en modo simple, por el primer anotador, con la pantalla y la regla de la
  # ronda 2 de la fase 3 (src/oclusion/c4_nivel_validacion.py). Las 500 personas de los 442 fotogramas. Respuestas: 1 se ve en
  # la RGB (baja), 2 no se ve en la RGB (severa), 3 no es persona (sin nivel: caja dudosa, como en la prueba).
  oclusion:
    herramienta: configs/fase3.yaml  # sección `oclusion` (pantalla y teclas) y `datasets.alineados`
    ronda: 2                         # regla en pantalla: la aclarada (docs/reglas_anotacion.md)
    personas: fase7/oclusion_validacion_personas.csv   # dentro de data/: lista fija, en orden de vuelo y fotograma
    respuestas: fase7/oclusion_validacion_simple.csv   # dentro de data/: respuestas (retoma si se cierra)
    nivel: fase7/oclusion_validacion_nivel.csv         # dentro de data/: nivel de cada persona para el evaluador
    comprobar: {fotogramas: 442, personas: 500}
    # Consistencia entre fotogramas seguidos, sin reanotar (pedida por el usuario el 21 de noviembre de 2026, después de
    # anotar): la misma persona en las posiciones p y p+1 del mismo vuelo, emparejada por la IoU de la caja térmica
    # (asignación húngara que maximiza la IoU total del par de fotogramas). Un emparejamiento cuenta si su IoU llega al
    # umbral. Decide `iou_min`; los de `sensibilidad` solo se reportan. Los pares excluidos no se saltan (MtErie 0007,
    # 53 a 55). Salidas en <salidas>/<carpeta>.
    consistencia:
      iou_min: 0.3
      sensibilidad: [0.1, 0.5]
      carpeta: consistencia
      ventana_alturas: 6             # recorte de cada caso en las figuras: 6 altos de la caja, al menos `ventana_min` px
      ventana_min: 64
      casos_por_figura: 8
  # Subconjuntos, todos sobre los 442 fotogramas. En los niveles, las personas de otro nivel y las "no es persona" se
  # ignoran (iscrowd). "Sin dudosas": las "no es persona" se ignoran también en todos_442. McNemar en los tres, con las
  # dudosas fuera (mcnemar.dudosas de la base).
  subconjuntos:
    - {nombre: todos_442, personas: todas, rotulo: "Todas"}
    - {nombre: baja, personas: baja, rotulo: "Baja\n(se ve en la RGB)"}
    - {nombre: severa, personas: severa, rotulo: "Severa\n(no se ve en la RGB)"}
