# Fase 7 (18 de noviembre de 2026): mejorar el resultado sin romper el protocolo.
# - FHL 0405/0406 (la prueba) no se usa en nada: ni entrenamiento ni validación. Sus imágenes no se leen.
# - No se tocan runs/ ni los datasets existentes: todo lo nuevo va en runs/<carpeta>/, reports/fase7.md y este archivo.
# - Validación: la de siempre (FHL 0134 y MtErie 0007).
# Partes: C0 auditoría (scripts/fase7_c0_auditoria.py), C1 datasets, C2 receta, C3 corridas y C4 evaluación.

carpeta: fase7                       # dentro de runs/
fase_bitacora: "7"
pares: pares.csv                     # dentro de data/
tam_termica: [640, 512]
extensiones: [.jpeg, .jpg, .png]
tramos_px: [8, 12, 20, 32]           # lado mayor: <8, 8-12, 12-20, 20-32, >=32 (QFDet), como en el diagnóstico
prohibidas: [210924_FHL_Enterprise_IR_0406, 210924_FHL_Enterprise_VIS_0405]   # FHL 0405: el script sale si aparecen
fuente: arial.ttf

# C0. Auditoría de las térmicas anotadas fuera de los 4 617 pares (sin entrenar).
c0:
  # Carpetas IR con etiquetas fuera de nuestros pares (A1 del diagnóstico). Baker IR_2 de 2022 (todos los .txt
  # vacíos) queda fuera, como pidió el usuario.
  carpetas:
    - 210327_Airfield_FLIR_IR_1
    - 210327_Airfield_FLIR_IR_2
    - 210327_Airfield_FLIR_IR_3
    - 210327_Airfield_FLIR_IR_4
    - 210327_Airfield_FLIR_IR_5
    - 210327_Airfield_FLIR_IR_6
    - 210327_Airfield_FLIR_IR_7
    - 210327_Airfield_FLIR_IR_8
    - 200929_Karen_FLIR_IR_1
    - 200929_Karen_FLIR_IR_2
    - 200929_Karen_FLIR_IR_3
    - 200929_Karen_FLIR_IR_4
    - 200929_Karen_FLIR_IR_5
    - 200929_Karen_FLIR_IR_6
    - 200910_Carnation_FLIR_IR_1
    - 200910_Carnation_FLIR_IR_2
    - 200910_Carnation_FLIR_IR_3
    - 200910_Carnation_FLIR_IR_4
    - 200910_Carnation_FLIR_IR_5
    - 200910_Carnation_FLIR_IR_6
    - 200910_Carnation_FLIR_IR_7
    - 200704_Baker_FLIR_IR_1
    - 200704_Baker_FLIR_IR_2
    - 210924_FHL_Enterprise_IR_0404   # pareja de FHL 0403 (RGB sin etiquetas)
    - 210924_FHL_Enterprise_IR_0565   # pareja de FHL 0564
    - 210924_FHL_Enterprise_IR_0567   # pareja de FHL 0566
    # Añadida el 18 de noviembre de 2026, cuando el usuario decidió usar la térmica de Carnation 0023/0024 (excluida
    # de los tres modelos en la fase 2 por el zoom de la RGB): se audita igual que las demás.
    - 210529_Carnation_Enterprise_IR_0024
  muestra: {con_cajas: 10, sin_cajas: 10, seed: 0}   # al azar por carpeta, cada una con su propio generador seed 0
  # Detector que solo señala candidatos para la revisión a ojo (personas sin caja, cajas sin persona); no decide nada.
  # Es el best.pt de B1 del diagnóstico (solo térmica, reparto al azar de los 6 vuelos; no vio FHL 0405).
  detector:
    pesos: runs/diagnostico/b1_termico_aleatoria_30ep/weights/best.pt
    imgsz: 640
    device: 0
    batch: 32
    conf_minima: 0.1                 # predicciones que se guardan
    conf_dibujo: 0.25                # las que se dibujan en los mosaicos
    conf_alta: 0.5                   # "posible persona sin caja": predicción >= 0.5 sin caja con IoU >= iou_minimo
    iou_minimo: 0.1
  mosaico:
    escala: 0.5                      # cada fotograma a 320 x 256
    columnas: 5
    lado_recorte: 48                 # px de la térmica alrededor del candidato
    zoom_recorte: 3
    recortes_max: 30
    vecino_max: 10                   # fotogramas sin caja: recortes donde estaban las cajas del anotado más cercano
    alto_grafico: 110
  # Marca de agua "FLIR" en la esquina inferior izquierda de las térmicas de 2020 (Baker, Karen y Carnation FLIR; no en
  # Airfield ni en las Enterprise). El detector la toma por persona: sus predicciones se ignoran en la auditoría.
  logo:
    caja: [5, 490, 54, 506]          # xyxy en px de 640 x 512, medida con los píxeles blancos en 15 fotogramas
    margen: 6
    pixeles_minimos: 200             # blancos (>= 235) en la caja en todos los fotogramas revisados = la carpeta tiene logo
    fotogramas: 15
  # C0. ¿La semejanza congelada de otro vuelo de FHL (mismo dron y mismo día) alinea la RGB con la térmica de FHL 0403,
  # 0564 y 0566 (RGB sin etiquetas)? Medida automática: corrimiento del fondo por correlación de fase de los
  # gradientes, como en la fase 2. Medida a mano: puntos de control (scripts/fase7_marcar_puntos.py).
  alineacion:
    vuelos:                          # rango de posiciones que se usaría (null = todo el vuelo)
      210924_FHL_Enterprise_0403: [0, 215]    # la térmica (IR_0404) solo está anotada en 0-215
      210924_FHL_Enterprise_0564: null
      210924_FHL_Enterprise_0566: null
    # La de FHL 0405 se estimó con las cajas de la prueba: se mide porque lo pidió el usuario, pero no se adopta si
    # 0134 o 0401 alcanzan.
    candidatas: [210924_FHL_Enterprise_0134, 210924_FHL_Enterprise_0401, 210924_FHL_Enterprise_0405]
    referencias: [210924_FHL_Enterprise_0134, 210924_FHL_Enterprise_0401]   # cada una con su propia semejanza
    transformaciones: configs/homografias_cajas.yaml
    muestra: 40                      # pares repartidos en el rango
    fondo_sigma: 2                   # como fase2.yaml (revision_desfases)
    fondo_respuesta_min: 0.10
    superposiciones: 2               # fotogramas por vuelo con los bordes de la RGB llevada sobre la térmica
    canny: [60, 160]
    criterio:                        # fijado el 18 de noviembre de 2026, antes de medir
      fondo_factor_referencia: 1.5   # mediana del corrimiento <= 1.5 x la mayor mediana de las referencias
      puntos_error_medio_px: 13.2    # error medio en los puntos a mano <= el de la fase 2 en FHL (13.2 px)
  # Puntos de control a mano (scripts/fase7_marcar_puntos.py, que usa la herramienta de la fase 2). Los valores de
  # pantalla son los de `marcado` en configs/fase2.yaml; aquí son 2 fotogramas por vuelo.
  marcado:
    carpeta_puntos: configs/fase7_puntos_control   # un yaml por vuelo, relativo a la raíz del repositorio
    puntos_minimos: 6
    ancho_ventana: 1800
    alto_ventana: 820
    margen_pantalla_px: 10
    reserva_titulo_px: 45
    lado_lupa: 400
    zoom_lupa: 4
    paso_mover: 5
    franja_inicial: {x: [0.18, 0.84], y: [0.06, 0.98]}   # sugerencia antes de 4 puntos, como en la fase 2
    nombres: [primero, segundo]
    fotogramas:                      # los más nítidos cerca de 1/3 y 2/3 del rango; en 0566 (de noche), con luces
      210924_FHL_Enterprise_0403: {primero: 63, segundo: 156}
      210924_FHL_Enterprise_0564: {primero: 345, segundo: 663}
      210924_FHL_Enterprise_0566: {primero: 227, segundo: 681}
    realce_rgb: {210924_FHL_Enterprise_0566: 6}   # solo en pantalla: la RGB de noche se multiplica por este factor
  # Clasificación tras la revisión a ojo (18 de noviembre de 2026), pendiente de confirmación del usuario.
  # - usable: en la muestra las cajas caen sobre personas y no hay personas sin caja, salvo las cortadas por el borde;
  # - con_tramos: el problema está en tramos que se quitan;
  # - no_usable: faltan personas en los fotogramas anotados, o casi nada está anotado.
  # El detector solo señaló dónde mirar; ningún tramo se decide con él.
  clasificacion:
    usable: [200929_Karen_FLIR_IR_3, 200929_Karen_FLIR_IR_4, 200929_Karen_FLIR_IR_5, 200929_Karen_FLIR_IR_6,
             200910_Carnation_FLIR_IR_1, 200910_Carnation_FLIR_IR_2, 200910_Carnation_FLIR_IR_3,
             200910_Carnation_FLIR_IR_4, 200910_Carnation_FLIR_IR_5, 200910_Carnation_FLIR_IR_6,
             200910_Carnation_FLIR_IR_7, 200704_Baker_FLIR_IR_1, 200704_Baker_FLIR_IR_2, 210327_Airfield_FLIR_IR_2,
             210327_Airfield_FLIR_IR_6, 210327_Airfield_FLIR_IR_7, 210327_Airfield_FLIR_IR_8,
             210924_FHL_Enterprise_IR_0565, 210924_FHL_Enterprise_IR_0567,
             210529_Carnation_Enterprise_IR_0024]   # añadida: cajas bien; en 144 y 535-537, personas sin caja (huecos cortos)
    con_tramos:                      # tramos [a, b] de posiciones que se quitan
      200929_Karen_FLIR_IR_1: [[316, 451]]      # cola con cajas intermitentes; persona sin caja en 451
      200929_Karen_FLIR_IR_2: []                # solo los huecos cortos: personas sin caja en 100 y 337
      210327_Airfield_FLIR_IR_1: [[575, 675]]   # mancha caliente sin caja, quizá una persona vista desde arriba (584-666)
      210327_Airfield_FLIR_IR_3: [[985, 1061]]  # una segunda persona sin caja en todo el tramo
      210327_Airfield_FLIR_IR_4: [[0, 58]]      # una segunda persona sin caja; el disco de 484-606 es un objeto fijo
      210924_FHL_Enterprise_IR_0404: [[216, 1416]]   # desde 216 no hay cajas y el grupo de personas sigue a la vista
    no_usable:
      210327_Airfield_FLIR_IR_5: "2 fotogramas con caja; persona sin caja en 95"
    # En todas: se quitan los .txt vacíos de `mosaico.vecino_max` fotogramas o menos con cajas a los dos lados (en
    # Karen 2 ahí había personas sin caja).
    huecos_cortos: true
  # Fotogramas completos que respaldan la clasificación (--parte ampliar): cajas en verde y predicciones >= conf_dibujo
  # en rojo. Salen en runs/<carpeta>/c0/revision/.
  ampliaciones:
    210327_Airfield_FLIR_IR_1: [78, 586, 602, 663]
    210327_Airfield_FLIR_IR_3: [985, 1010, 1035, 1060]
    210327_Airfield_FLIR_IR_4: [10, 40, 484, 606]
    210327_Airfield_FLIR_IR_5: [14, 15, 95, 96]
    200929_Karen_FLIR_IR_1: [315, 380, 405, 451]
    200929_Karen_FLIR_IR_2: [99, 100, 336, 337]
    210924_FHL_Enterprise_IR_0404: [215, 219, 546, 880]
    210924_FHL_Enterprise_IR_0567: [1, 597, 623, 885]

# Copia para git (scripts/fase7_copiar.py): runs/ no va a git, así que las salidas livianas de runs/<carpeta>/ se copian
# a reports/<destino>/ con la misma estructura. Los PNG se guardan como JPEG para que el repositorio pese menos.
copiar:
  destino: fase7                     # dentro de reports/
  desde_runs:                        # globs dentro de runs/<carpeta>/
    - c0/auditoria/*.csv
    - c0/auditoria/*.md
    - c0/auditoria/mosaicos/*.png
    - c0/revision/*.png
    - c0/alineacion/*
    - c0/clasificacion/*
    - c1/*.csv
    - c1/*.md
  excluir: ["*.pt"]
  jpeg_calidad: 85

# C1. Datasets nuevos (scripts/fase7_c1_datasets.py). Decisiones del usuario del 18 de noviembre de 2026, al cerrar C0:
#   - confirma la clasificación de C0 y la regla de los huecos cortos;
#   - FHL 0566: solo como térmica sin pareja (RGB en 0); no se marcan sus puntos;
#   - Carnation 0023/0024: su térmica entra (auditada en C0 como una carpeta más), y en la fusión sin pareja;
#   - pares anotados y excluidos de los vuelos de entrenamiento: entran como térmica (sin pareja en la fusión), salvo
#     el tramo de Baker 2031-2179 (personas sin caja en la térmica);
#   - FHL 0403 y 0564: pares reales en la fusión solo si su semejanza pasa los puntos a mano (<= 13.2 px); si no,
#     térmica sin pareja;
#   - imágenes nuevas sin persona: como máximo el 10 % del total de entrenamiento, al azar (seed 0) y repartidas por
#     carpeta.
# termico_ampliado y fusion_ampliado tienen las mismas imágenes; cambia solo si la RGB es real o va en 0.
c1:
  particion: configs/particion.yaml
  base: {termico: configs/termico.yaml, fusion: configs/fusion.yaml}   # entrenamiento y validación actuales
  excluidos_entrenamiento:
    salvo: {220109_Baker_Enterprise_1: [[2031, 2179]]}
  pares_reales:
    candidatos: {210924_FHL_Enterprise_0403: 210924_FHL_Enterprise_IR_0404,
                 210924_FHL_Enterprise_0564: 210924_FHL_Enterprise_IR_0565}
    aprobados: []                    # se llena con los que pasen los puntos a mano (--parte puntos de C0)
    semejanza: 210924_FHL_Enterprise_0401
  vacias:
    fraccion_maxima: 0.10            # vacías nuevas <= 10 % de todo el entrenamiento (base + nuevas)
    reparto: proporcional            # cupo por carpeta en proporción a sus vacías (restos mayores); al azar dentro
    seed: 0
  tiempo:                            # s por época = s por imagen de entrenamiento x imágenes + validación (epocas.csv)
    corridas: {termico: runs/diagnostico/b2_termico_vuelo_30ep, fusion: runs/fase5/fusion_100ep}
    epocas: 100
  salida: fase7                      # data/<salida>/ (no va a git)
