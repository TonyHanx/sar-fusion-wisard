# Fase 2: alineación de la RGB con la térmica (semejanza por vuelo estimada con los centros de las cajas de personas,
# validada con puntos de control marcados a mano).
seed: 0
pares: pares.csv                    # dentro de data/; se usan solo los anotados y no excluidos
tam_termica: [640, 512]
fuente: arial.ttf

# Zona de la RGB que ve la térmica (CLAUDE.md), normalizada. Punto de partida para sugerir correspondencias.
franja_inicial: {x: [0.18, 0.84], y: [0.06, 0.98]}

# Vuelos donde la relación se invierte (la RGB tiene zoom y la térmica la contiene).
vuelos_invertidos: [210529_Carnation_Enterprise_0023]

# Marcado de puntos de control (scripts/marcar_puntos.py).
marcado:
  carpeta_puntos: configs/puntos_control   # un yaml por vuelo, relativo a la raíz del repositorio
  puntos_minimos: 6                        # por fotograma
  # Tamaño máximo del lienzo principal (RGB + térmica), en px físicos de pantalla. La herramienta es consciente del
  # DPI (la escala de Windows al 125 % ya no agranda la ventana) y además lo recorta para que quepan en el área de
  # trabajo la ventana principal y la lupa debajo (en 1920 x 1140 queda de unos 1800 x 620).
  ancho_ventana: 1800
  alto_ventana: 820
  margen_pantalla_px: 10                   # separación de las ventanas con el borde izquierdo y derecho
  reserva_titulo_px: 45                    # alto que se reserva para la barra de título de cada ventana
  lado_lupa: 400                           # px de la ventana de lupa
  zoom_lupa: 4                             # aumento de la lupa respecto de la ventana principal
  paso_mover: 5                            # posiciones que avanza o retrocede el fotograma con j/l
  fotogramas:                              # en la parte estable de cada vuelo, con detalles visibles en las dos cámaras
    210417_MtErie_Enterprise_0003: {inicio: 0, mitad: 132, final: 263}   # ya marcados a mano el 2026-10-31
    210417_MtErie_Enterprise_0005: {inicio: 30, mitad: 130, final: 260}
    210417_MtErie_Enterprise_0007: {inicio: 10, mitad: 90, final: 160}
    210924_FHL_Enterprise_0134: {inicio: 10, mitad: 150, final: 262}
    210924_FHL_Enterprise_0401: {inicio: 20, mitad: 450, final: 840}   # final 860 -> 840: el aterrizaje empieza en 857
    210924_FHL_Enterprise_0405: {inicio: 30, mitad: 440, final: 930}
    220109_Baker_Enterprise_1: {inicio: 80, mitad: 1040, final: 1990}

# Homografías RGB (px originales) -> térmica (px), una por vuelo (scripts/fase2_homografias.py).
homografias:
  salida: configs/homografias.yaml         # relativo a la raíz del repositorio
  umbral_ransac_px: 3.0                    # error de reproyección máximo para contar un punto como inlier (px térmicos)
  umbral_variacion_px: 3.0                 # error cruzado medio máximo entre fotogramas para usar una sola homografía
  rejilla: 9                               # puntos por lado de la rejilla para comparar homografías (informativo)

# Escala RGB/térmica por fotograma a partir de la imagen (scripts/fase2_escala_por_fotograma.py), para encontrar
# despegues, aterrizajes y cambios de zoom. Correlación de bordes entre la RGB reescalada y el centro de la térmica.
escala_por_fotograma:
  ancho_rgb_trabajo: 480            # la RGB se reduce a este ancho antes de buscar
  reduccion_termica: 2              # la térmica se reduce a la mitad
  sigma_bordes: 1.5
  recorte_centro: 0.6               # fracción central de la térmica usada como plantilla
  escala_min: 0.4                   # relativa a la escala de la franja inicial
  escala_max: 2.5
  pasos_gruesos: 21
  pasos_finos: 9
  umbral_escala: 0.10               # |log(escala / mediana del vuelo)| por encima de esto = fotograma distinto
  umbral_ncc_relativo: 0.6          # correlación por debajo de esta fracción de la mediana del vuelo = distinto
  hueco_max: 3                      # fotogramas normales permitidos dentro de un mismo tramo
  procesos: 6
  salida: alineacion/escala_por_fotograma.csv     # dentro de reports/

# Zoom relativo RGB/térmica a lo largo del vuelo (scripts/fase2_zoom_temporal.py): escala entre fotogramas
# consecutivos de cada cámara (ORB + transformación de semejanza con RANSAC). Si solo cambia la RGB, cambió su zoom.
zoom_temporal:
  ancho_rgb: 960
  ancho_termica: 640
  puntos_orb: 3000
  umbral_ransac_px: 3.0
  inliers_minimos: 20
  umbral_zoom: 0.05                 # |log(zoom acumulado / nivel normal del vuelo)| por encima = fotograma distinto
  umbral_salto: 0.05                # |log(s_rgb / s_termica)| entre dos fotogramas por encima = salto de zoom
  hueco_max: 3
  procesos: 6
  salida: alineacion/zoom_temporal.csv          # dentro de reports/

# Barrido visual de cada vuelo (scripts/fase2_barrido.py): un fotograma cada `paso`, RGB recortada a la franja junto
# a la térmica. Es lo que se usó para encontrar despegues, aterrizajes y cambios de zoom (los métodos automáticos de
# arriba dieron demasiadas falsas alarmas).
barrido:
  paso: 10
  por_hoja: 24
  por_fila: 4
  ancho_panel: 200                  # px de cada mitad de la celda
  calidad_jpg: 85
  salida: alineacion/barrido        # dentro de reports/

# Tramos excluidos que se encontraron con el barrido (confirmados el 2026-10-31 y ya en configs/fase1.yaml).
# Imágenes de cada borde: antes, borde y después (scripts/fase2_bordes_tramos.py).
bordes_tramos:
  alto_panel: 300
  calidad_jpg: 88
  salida: alineacion/bordes_tramos  # dentro de reports/
  tramos:
    - vuelo: 220109_Baker_Enterprise_1
      desde: 0
      hasta: 15
      tipo: despegue
      nota: dron en el suelo (0 a 13, se ve su propia estructura abajo en la RGB) y despegando (14 y 15)
    - vuelo: 210924_FHL_Enterprise_0401
      desde: 0
      hasta: 10
      tipo: cambio de zoom
      nota: la RGB tiene más zoom que en el resto del vuelo; cambia entre 10 y 11
    - vuelo: 210924_FHL_Enterprise_0401
      desde: 857
      hasta: 895
      tipo: aterrizaje
      nota: el dron baja hasta el pasto; desde la 857 las personas de las dos cámaras se separan más de 25 px (semejanza)

# Pares lado a lado para revisar antes de alinear (scripts/fase2_lado_a_lado.py).
lado_a_lado:
  fotogramas:                       # por vuelo: inicio, mitad, final o posiciones
    210529_Carnation_Enterprise_0023: [inicio, mitad, final, 400, 440, 470, 500, 530, 560, 600, 630, 660]
    210924_FHL_Enterprise_0401: [inicio, 10, 50, mitad, 850, 870, final]
  alto_panel: 512
  salida: alineacion/lado_a_lado    # dentro de reports/

# Alineación RGB -> térmica de cada vuelo con los centros de las cajas de personas
# (scripts/fase2_homografias_cajas.py). Solo pares con persona en las dos imágenes; la mitad (al azar, seed) estima
# la transformación y la otra mitad mide la distancia entre centros. Decidido el 2026-10-31 en lugar del marcado a
# mano; modelo: semejanza (la homografía completa se deformaba en FHL 0134 y MtErie 0007).
homografias_cajas:
  modelo: semejanza                 # el que se guarda: homografia (8 grados de libertad), afin (6) o semejanza (4)
  modelos_comparados: [homografia, afin, semejanza]   # además de la franja nominal, con la misma partición
  fraccion_calibracion: 0.5
  compuerta_inicial_px: 80          # distancia máxima (px térmicos) para emparejar personas con la franja nominal
  compuerta_px: 30                  # la misma, con la transformación ya estimada
  iteraciones: 3                    # emparejar y volver a estimar
  umbral_ransac_px: 8.0
  max_iter_ransac: 5000
  confianza_ransac: 0.999
  margen_borde_px: 3                # se ignoran las cajas que tocan el borde de la térmica (persona cortada)
  # Criterios para avisar y proponer el marcado a mano (propuestos por Claude el 2026-10-31, pendientes de aprobar)
  pares_calibracion_minimos: 30
  cobertura_minima: 0.10            # fracción de la térmica que cubren las personas usadas (envolvente convexa)
  deformacion_maxima: 0.10          # cuánto se aleja de un rectángulo el campo de visión implicado (unidades de la RGB)
  distancia_mediana_maxima_px: 5    # la media la dominan los desfases de giros rápidos; la mediana no
  error_puntos_manuales_max_px: 3.0 # el mismo umbral que umbral_variacion_px del marcado a mano
  # Regla de desfase (decidida el 2026-10-31): se excluyen los tramos de `desfase_min_pares` o más posiciones seguidas
  # con alguna persona a más de `umbral_desfase_px` (todas medidas: un par sin persona en las dos imágenes corta el
  # tramo), y los pares "solo térmica" dentro de esos tramos o a `vecindad_solo_termica` posiciones o menos.
  umbral_desfase_px: 25
  desfase_min_pares: 2
  vecindad_solo_termica: 2
  ejemplos_desfase: 6               # tramos en la hoja de ejemplo, repartidos según su distancia máxima
  alto_panel_ejemplos: 240
  # Validación con puntos marcados a mano: vuelo -> fotogramas que se usan. En MtErie 0003 se descartan inicio y final
  # (marcados con la térmica cortada; decidido el 2026-10-31).
  validacion_manual:
    210417_MtErie_Enterprise_0003: [mitad]
    210924_FHL_Enterprise_0405: [inicio, mitad, final]
  peores_por_vuelo: 3               # superposiciones de los pares de evaluación con mayor distancia
  superposiciones_por_vuelo: 10     # pares repartidos a lo largo del vuelo, para revisar la alineación a ojo
  alto_panel: 384
  calidad_jpg: 88
  salida: configs/homografias_cajas.yaml            # relativo a la raíz del repositorio
  carpeta_reporte: alineacion/homografias_cajas     # dentro de reports/
